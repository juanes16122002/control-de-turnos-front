server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # --- Cabeceras de seguridad (mantener sincronizadas con vercel.json) ---
    # CSP: solo scripts propios (bloquea scripts inyectados), fuentes de Google y la API.
    # Para endurecer, reemplaza "https:" en connect-src por el dominio exacto de la API.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; connect-src 'self' https: http://localhost:5000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Geolocalización solo para este sitio (kiosco); cámara/micrófono bloqueados
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

    location / {
        try_files $uri /index.html;
    }
}
